<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1C1B3A">
<title>Elixir Hour</title>
<meta name="description" content="Coffee Talk, in the Clash Royale universe. A cosy bar on the neutral ground between two warring kingdoms, where the fighters come to drink and talk once the arena closes.">
<!-- Link-preview / share plumbing (GDD §12 share-quality bar): a pasted link
     should look as good as the game. FLAG: set the ABSOLUTE og:url + og:image
     URLs when the landing page deploys (swap the canonical URL everywhere). -->
<meta property="og:type" content="website">
<meta property="og:title" content="Elixir Hour">
<meta property="og:description" content="Coffee Talk, in the Clash Royale universe. Play the first three Nights.">
<meta property="og:image" content="assets/share/night-cap-share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1500">
<meta property="og:image:alt" content="An Elixir Hour Night Cap — a keepsake scroll of the night's regulars, the drinks poured and a quote.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Elixir Hour">
<meta name="twitter:description" content="Coffee Talk, in the Clash Royale universe. Play the first three Nights.">
<meta name="twitter:image" content="assets/share/night-cap-share.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="viewport">
  <div id="stage">

    <!-- TITLE / LOADING -->
    <div class="screen" id="screen-title">
      <img id="title-bg" src="assets/scenes/Bar Scene V1 (title).jpg" alt="">
      <canvas id="fx" width="1280" height="720"></canvas>
      <img id="title-logo" src="assets/logo/Elixir Hour Logo (transparent).png" alt="Elixir Hour">
      <div id="title-menu">
        <button class="btn primary" id="btn-start"></button>
        <button class="btn" id="btn-continue"></button>
        <button class="btn" id="btn-settings"></button>
      </div>
    </div>

    <!-- HERALD INTERSTITIAL -->
    <div class="screen" id="screen-herald">
      <div id="herald-wrap">
        <div id="broadsheet">
          <h1 id="herald-masthead"></h1>
          <div id="herald-ed"></div>
          <h2 id="herald-head"></h2>
          <p id="herald-story"></p>
          <div class="cont" id="herald-continue"></div>
        </div>
      </div>
    </div>

    <!-- SERVE (Layout 1) — the locked two-layer composite (GDD §12):
         master scene (bar baked in) below, no-bar character cutout on top,
         mixing panel overlay bottom-right. The master scene here is a CSS
         placeholder until the locked scene art lands (Milestone 8). -->
    <div class="screen" id="screen-serve">
      <div id="ms">
        <div id="ms-wall">
          <div id="ms-window"><i id="ms-hint-blue"></i><i id="ms-hint-red"></i></div>
          <div id="ms-shelf">
            <i class="ms-bottle" style="background:#7A3FA0"></i><i class="ms-bottle" style="background:#4e9a51"></i><i class="ms-bottle" style="background:#e8c34d"></i><i class="ms-bottle" style="background:#6fa7d8"></i><i class="ms-bottle" style="background:#5fb8a8"></i><i class="ms-bottle" style="background:#6d7a3f"></i>
          </div>
          <div id="ms-tap"></div>
        </div>
        <div id="ms-counter"></div>
      </div>
      <div id="serve-shadow"></div>
      <img id="serve-char" src="" alt="">
      <div class="scene-tint"></div>
      <div id="serve-bubble" class="bubble">
        <div id="serve-speaker" class="speaker"></div>
        <div id="serve-line" class="line"></div>
      </div>
      <div id="serve-choices"></div>
      <div id="panel-frame">
        <div id="panel-info" title=""></div>
        <div class="slotcol">
          <div class="slot" id="slot-base"><small id="lbl-base"></small><b id="base-name"></b><span class="dot" id="base-dot"></span></div>
          <div class="slot" id="slot-mix1"><small class="lbl-mixer"></small><b id="mix1-name"></b><span class="dot" id="mix1-dot"></span>
            <div class="picker" id="picker1"></div></div>
          <div class="slot" id="slot-mix2"><small class="lbl-mixer"></small><b id="mix2-name"></b><span class="dot" id="mix2-dot"></span>
            <div class="picker" id="picker2"></div></div>
        </div>
        <div class="meters">
          <div class="meter"><label id="lbl-warmth"></label><div class="segs" id="m-warmth"></div></div>
          <div class="meter"><label id="lbl-kick"></label><div class="segs" id="m-kick"></div></div>
          <div class="meter"><label id="lbl-chill"></label><div class="segs" id="m-chill"></div></div>
          <div class="meter"><label id="lbl-bite"></label><div class="segs" id="m-bite"></div></div>
          <div class="dose-spacer"></div>
        </div>
        <div class="rightcol">
          <div id="recipe"><img id="tankard" src="assets/ui/Tankard Icon (cutout).png" alt=""><div id="recipename"></div></div>
          <button class="pbtn" id="brew-reset"></button>
          <button class="pbtn pour" id="brew-pour"></button>
        </div>
        <div class="dose"><span id="lbl-gentle"></span><input type="range" min="1" max="3" value="1" id="dose"><span id="lbl-strong"></span></div>
      </div>
      <div id="brewstrip">
        <div class="brewpanel"><img src="assets/ui/Brew Panel - The Pour (4x5).png" alt=""><div class="fill"></div></div>
        <div class="brewpanel"><img src="assets/ui/Brew Panel - Spell Drop (4x5).png" alt=""><div class="fill"></div></div>
        <div class="brewpanel"><img src="assets/ui/Brew Panel - The Stir (4x5).png" alt=""><div class="fill"></div></div>
      </div>
    </div>

    <!-- GROUP — Layout 3 (GDD §11): wide ensemble at the bar, no mixing UI.
         Same master-scene placeholder pieces as the serve screen; the cast
         row is placed programmatically (src/screens.js renderGroup). -->
    <div class="screen" id="screen-group">
      <div id="g-ms">
        <div id="g-wall"></div>
        <div id="g-counter"></div>
      </div>
      <div id="group-row"></div>
      <div class="scene-tint"></div>
      <div id="group-bubble" class="bubble">
        <div class="speaker"></div>
        <div class="line"></div>
      </div>
    </div>

    <!-- SPLIT DUOLOGUE — Layout 5 (GDD §11): two customers conversing on a
         diagonal split canvas, bottom-centre name-box in the speaker's colour. -->
    <div class="screen" id="screen-duo">
      <div class="duo-half left"><img src="" alt=""></div>
      <div class="duo-half right"><img src="" alt=""></div>
      <div class="scene-tint"></div>
      <div id="duo-box">
        <span class="speaker"></span>
        <div class="line"></div>
      </div>
    </div>

    <!-- NIGHT COMPLETE -->
    <div class="screen" id="screen-nightend">
      <div class="placeholder"><b id="nightend-title"></b>
        <button class="btn small primary" id="btn-nextnight"></button>
        <button class="btn small sage" id="btn-nightcap-end"></button>
        <button class="btn small" id="btn-savequit"></button></div>
    </div>

    <!-- EPILOGUE — the morning-after Herald (GDD §9): the Championship
         report with the ONE line from the Knight's last cup, the decree
         lifted, and the closing card. -->
    <div class="screen" id="screen-epilogue">
      <div id="epi-wrap">
        <div id="epi-sheet">
          <h1 id="epi-masthead"></h1>
          <div id="epi-ed"></div>
          <h2 id="epi-head"></h2>
          <p id="epi-story"></p>
          <p id="epi-conseq"></p>
          <p id="epi-story2"></p>
        </div>
        <div id="epi-final"></div>
        <div class="epi-actions">
          <button class="btn small sage" id="btn-nightcap-epi"></button>
          <button class="btn small" id="btn-totitle"></button>
        </div>
      </div>
    </div>

    <!-- TOME OVERLAY (GDD §11) — the four ribbon tabs are painted INTO the
         spread art; these are hotspots + vector glyphs on top (mockup geometry) -->
    <div id="tome">
      <img id="tomeimg" src="assets/ui/Tome Spread.png" alt="">
      <div id="tomeclose"></div>
      <div class="tab" id="tab-brew" title="Brew Book">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h8a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M16 9h2.5a1.5 1.5 0 0 1 0 5H16"/><path d="M6 8h10"/></svg>
      </div>
      <div class="tab" id="tab-ledger" title="Regulars' Ledger">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="6" width="15" height="12" rx="2"/><path d="M8 10h8M8 14h5"/></svg>
      </div>
      <div class="tab" id="tab-herald" title="Arena Herald">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5c-1.2 0-2 .9-2 2s.8 2 2 2V5z"/><path d="M5 5h12a2 2 0 0 1 2 2v10a2 2 0 0 0 2 2H7a2 2 0 0 1-2-2V5z"/><path d="M9 9h6M9 13h6M9 16h4"/></svg>
      </div>
      <div class="tab" id="tab-song" title="Bard's Songbook">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="18" r="3"/><path d="M11 18V5l8-2v11"/><circle cx="16" cy="16" r="3"/></svg>
      </div>
      <div id="pageL"></div>
      <div id="pageR"></div>
      <div id="spread" hidden>
        <div id="spreadvp"><div id="spreadflow"></div></div>
      </div>
      <!-- nav furniture overlay: spans the paper box, always present so grid
           AND spread share one placement + one cleanup (no lingering arrows).
           The fletched arrow is page-turn only; back-to-grid is a round button. -->
      <div id="tomenav"></div>
      <div id="pageflip">
        <div class="backdrop"></div>
        <div class="sweep"></div>
        <div class="leaf">
          <div class="paper">
            <div class="face front"><div class="curlfx"></div></div>
            <div class="face back"><div class="edgemask"></div><div class="curlfx"></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- SETTINGS OVERLAY (GDD §11) -->
    <div id="settings" class="overlay">
      <div class="panel">
        <h2 id="set-title"></h2>
        <div class="setrow"><label id="set-lang-label" for="lang-select"></label><select id="lang-select"></select></div>
        <p id="set-disclaimer"></p>
        <div class="setrow"><label id="set-music-label"></label><button class="btn small toggle" id="tgl-music"></button></div>
        <div class="setrow"><label id="set-sfx-label"></label><button class="btn small toggle" id="tgl-sfx"></button></div>
        <div class="setrow"><span></span><button class="btn small sage" id="btn-about"></button></div>
        <button class="btn small primary" id="btn-set-back"></button>
      </div>
    </div>

    <!-- NIGHT CAP (GDD §11) — the shareable end-of-Night postcard, composed
         on a canvas from shipped art. Download PNG / Web Share where available. -->
    <div id="nightcap" class="overlay">
      <div class="nc-panel">
        <h2 id="nightcap-heading"></h2>
        <div class="nc-preview"><canvas id="nightcap-canvas" width="1200" height="1500"></canvas></div>
        <div class="nc-actions">
          <button class="btn small primary" id="nightcap-download"></button>
          <button class="btn small" id="nightcap-share" hidden></button>
          <button class="btn small" id="nightcap-close"></button>
        </div>
      </div>
    </div>

    <!-- ABOUT / CREDITS OVERLAY (GDD §13/§17 disclaimers) -->
    <div id="about" class="overlay">
      <div class="panel">
        <h2 id="about-title"></h2>
        <p id="about-p1"></p>
        <p id="about-p2"></p>
        <p id="about-p3"></p>
        <button class="btn small primary" id="btn-about-back"></button>
      </div>
    </div>

  </div>
</div>

<div id="dev" hidden></div>

<script src="strings/strings.js"></script>
<script src="data/nights.js"></script>
<script src="data/cast.js"></script>
<script src="data/tome.js"></script>
<script src="src/stage.js"></script>
<script src="src/save.js"></script>
<script src="src/particles.js"></script>
<script src="src/screens.js"></script>
<script src="src/brew.js"></script>
<script src="src/dialogue.js"></script>
<script src="src/state.js"></script>
<script src="src/tome.js"></script>
<script src="src/nightcap.js"></script>
<script src="src/audio.js"></script>
<script src="src/settings.js"></script>
<script src="src/boot.js"></script>
</body>
</html>
