<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1C1B3A">
<title>Elixir Hour</title>
<meta name="description" content="Coffee Talk, in the Clash Royale universe. A cosy bar on the neutral ground between two warring kingdoms, where the fighters come to drink and talk once the arena closes.">
<!-- Link-preview / share plumbing (GDD §12 share-quality bar): a pasted link
     should look as good as the game. FLAG: set the ABSOLUTE og:url + og:image
     URLs when the landing page deploys (swap the canonical URL everywhere). -->
<meta property="og:type" content="website">
<meta property="og:title" content="Elixir Hour">
<meta property="og:description" content="Coffee Talk, in the Clash Royale universe. Play the first three Nights.">
<meta property="og:image" content="assets/share/night-cap-share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1500">
<meta property="og:image:alt" content="An Elixir Hour Night Cap — a keepsake scroll of the night's regulars, the drinks poured and a quote.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Elixir Hour">
<meta name="twitter:description" content="Coffee Talk, in the Clash Royale universe. Play the first three Nights.">
<meta name="twitter:image" content="assets/share/night-cap-share.png">
<!-- Favicon set (the Elixir Drop, §UI). Browser tabs get the transparent drop;
     home-screen icons (apple-touch / manifest) get it on a dark glow plate so
     iOS/Android don't render the transparency as black. Versioned so a rebrand
     isn't stuck behind the aggressive favicon cache. -->
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=35">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=35">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=35">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=35">
<link rel="manifest" href="manifest.webmanifest?v=35">
<!-- Cache-bust: every local script/stylesheet carries ?v=<BUILD>. BUMP THIS
     TOKEN ON EVERY BUILD (find-replace all "?v=35") so a refresh always gets the
     current code — file:// and heuristic caches served stale JS to a real
     player once (P0 06-07) and stalled progression. -->
<link rel="stylesheet" href="css/fonts.css?v=35">
<link rel="stylesheet" href="css/main.css?v=35">
</head>
<body>
<div id="viewport">
  <div id="stage">

    <!-- TITLE / LOADING -->
    <div class="screen" id="screen-title">
      <img id="title-bg" src="assets/scenes/Bar Scene V1 (title).jpg" alt="">
      <canvas id="fx" width="1280" height="720"></canvas>
      <img id="title-logo" src="assets/logo/Elixir Hour Logo (transparent).webp" alt="Elixir Hour">
      <div id="title-menu">
        <button class="btn primary" id="btn-start"></button>
        <button class="btn sage" id="btn-continue"></button>
        <button class="btn" id="btn-tome-title" hidden></button>
        <button class="btn" id="btn-settings"></button>
      </div>
      <!-- visible build stamp (filled from window.BUILD by Screens.fillStatic) -->
      <div id="build-stamp" aria-hidden="true"></div>
    </div>

    <!-- HERALD INTERSTITIAL -->
    <div class="screen" id="screen-herald">
      <div id="herald-wrap">
        <div id="broadsheet">
          <h1 id="herald-masthead"></h1>
          <div id="herald-ed"></div>
          <h2 id="herald-head"></h2>
          <p id="herald-story"></p>
          <div class="cont" id="herald-continue"></div>
        </div>
      </div>
    </div>

    <!-- SERVE (Layout 1) — the locked two-layer composite (GDD §12):
         master scene (bar baked in) below, no-bar character cutout on top,
         mixing panel overlay bottom-right. The master scene here is a CSS
         placeholder until the locked scene art lands (Milestone 8). -->
    <div class="screen" id="screen-serve">
      <!-- Solo serve (§12 new canon, round 9): the whole screen is Tessa's pre-baked,
           hand-grounded scene (character + counter + brew wall in ONE image). Two
           stacked layers cross-fade on an expression swap; the backgrounds are pixel-
           identical so only the character dissolves, the bar stays rock-steady. No
           runtime compositing — no cutout, no anchors, no scale tables, no shadows. -->
      <div id="ms">
        <img id="ms-img" class="scene-layer" alt="">
        <img id="ms-img2" class="scene-layer" alt="">
      </div>
      <div class="scene-tint"></div>
      <div id="serve-bubble" class="bubble">
        <div id="serve-speaker" class="speaker"></div>
        <div id="serve-line" class="line"></div>
      </div>
      <!-- Sage's own bottom-left bubble (Fix 4): sage-tinted, no tail. SAGE is a
           fixed proper name (not localised, like the other speaker names). -->
      <div id="sage-bubble" class="bubble notail">
        <div class="speaker">SAGE</div>
        <div id="sage-line" class="line"></div>
      </div>
      <div id="serve-choices"></div>
      <div id="panel-frame">
        <!-- Order Strip (§7): during a brew beat shows the customer's order in
             their own words; the (i) opens the Brew Book. Hidden when locked. -->
        <div id="order-strip">
          <div id="order-text"></div>
          <div id="panel-info" title=""></div>
        </div>
        <!-- §7 tap-for-full: the complete request, shown above the panel (over the
             scene) when a trimmed Order Strip is tapped. Never in the flex flow, so
             it can't reflow the panel and re-open the Pour-overflow P0. -->
        <div id="order-full" aria-hidden="true"></div>
        <div class="panel-cols">
        <div class="slotcol">
          <div class="slot" id="slot-base"><small id="lbl-base"></small><b id="base-name"></b><span class="dot" id="base-dot"></span></div>
          <div class="slot" id="slot-mix1"><small class="lbl-mixer"></small><b id="mix1-name"></b><span class="dot" id="mix1-dot"></span>
            <div class="picker" id="picker1"></div></div>
          <div class="slot" id="slot-mix2"><small class="lbl-mixer"></small><b id="mix2-name"></b><span class="dot" id="mix2-dot"></span>
            <div class="picker" id="picker2"></div></div>
        </div>
        <div class="meters">
          <div class="meter"><label id="lbl-warmth"></label><div class="segs" id="m-warmth"></div></div>
          <div class="meter"><label id="lbl-kick"></label><div class="segs" id="m-kick"></div></div>
          <div class="meter"><label id="lbl-chill"></label><div class="segs" id="m-chill"></div></div>
          <div class="meter"><label id="lbl-bite"></label><div class="segs" id="m-bite"></div></div>
          <div class="dose-spacer"></div>
        </div>
        <div class="rightcol">
          <div id="recipe"><img id="tankard" src="assets/ui/Tankard Icon (cutout).webp" alt=""><div id="recipename"></div></div>
          <button class="pbtn" id="brew-reset"></button>
          <button class="pbtn pour" id="brew-pour"></button>
        </div>
        </div><!-- /.panel-cols -->
        <div class="dose">
          <span id="lbl-gentle"></span>
          <div class="dose-track">
            <input type="range" min="1" max="3" step="1" value="1" id="dose" aria-label="Dose" aria-valuetext="1 drop">
            <div class="dose-pips" aria-hidden="true"><span>•</span><span>••</span><span>•••</span></div>
            <div id="dose-live" class="dose-live">1 drop</div>
          </div>
          <span id="lbl-strong"></span>
        </div>
      </div>
      <div id="brewstrip">
        <div class="brewpanel"><img src="assets/ui/Brew Panel - The Pour (4x5).webp" alt=""><div class="fill"></div></div>
        <div class="brewpanel"><img src="assets/ui/Brew Panel - Spell Drop (4x5).webp" alt=""><div class="fill"></div></div>
        <div class="brewpanel"><img src="assets/ui/Brew Panel - The Stir (4x5).webp" alt=""><div class="fill"></div></div>
      </div>
    </div>

    <!-- GROUP — Layout 3 (GDD §11): wide ensemble at the bar, no mixing UI.
         Same master-scene placeholder pieces as the serve screen; the cast
         row is placed programmatically (src/screens.js renderGroup). -->
    <div class="screen" id="screen-group">
      <div id="g-ms">
        <img id="g-img" src="assets/scenes/Group Scene V2.webp?v=35" alt="">
      </div>
      <div id="group-row"></div>
      <div class="scene-tint"></div>
      <div id="group-bubble" class="bubble">
        <div class="speaker"></div>
        <div class="line"></div>
      </div>
    </div>

    <!-- TWO-SHOT — Layout 5 (GDD §11, round 9): two customers conversing INSIDE the
         bar. The left character IS a pre-baked serve scene (backdrop: their grounded
         figure + the room + counter); the right character is a grounded cutout shifted
         onto the right of the same counter (identical background → the wood seam
         vanishes). The diagonal split is a lighting treatment over the composed scene,
         dimming the silent half — never flat panels. Name-box in the speaker's colour. -->
    <div class="screen" id="screen-duo">
      <!-- round 11: BOTH characters are cutouts pasted onto the EMPTY BAR backdrop
           (never a character's serve scene — that leaks the baked character, e.g. a
           stray Knight behind the Hog). Left + right each get a cross-fade pair. -->
      <div id="duo-scene">
        <img id="duo-bg" class="scene-layer" alt="">
        <img id="duo-left" class="duo-cut duo-l" alt="">
        <img id="duo-left2" class="duo-cut duo-l" alt="">
        <img id="duo-right" class="duo-cut duo-r" alt="">
        <img id="duo-right2" class="duo-cut duo-r" alt="">
      </div>
      <div id="duo-split" aria-hidden="true"></div>
      <div class="scene-tint"></div>
      <div id="duo-box">
        <span class="speaker"></span>
        <div class="line"></div>
      </div>
    </div>

    <!-- NIGHT COMPLETE -->
    <div class="screen" id="screen-nightend">
      <div class="placeholder"><b id="nightend-title"></b>
        <button class="btn small primary" id="btn-nextnight"></button>
        <button class="btn small sage" id="btn-nightcap-end"></button>
        <button class="btn small" id="btn-savequit"></button></div>
    </div>

    <!-- EPILOGUE — the morning-after Herald (GDD §9): the Championship
         report with the ONE line from the Knight's last cup, the decree
         lifted, and the closing card. -->
    <div class="screen" id="screen-epilogue">
      <div id="epi-wrap">
        <div id="epi-sheet">
          <h1 id="epi-masthead"></h1>
          <div id="epi-ed"></div>
          <h2 id="epi-head"></h2>
          <p id="epi-story"></p>
          <p id="epi-conseq"></p>
          <p id="epi-story2"></p>
        </div>
        <div id="epi-final"></div>
        <div class="epi-actions">
          <button class="btn small sage" id="btn-nightcap-epi"></button>
          <button class="btn small" id="btn-totitle"></button>
        </div>
      </div>
    </div>

    <!-- TOME OVERLAY (GDD §11) — the four ribbon tabs are painted INTO the
         spread art; these are hotspots + vector glyphs on top (mockup geometry) -->
    <div id="tome">
      <img id="tomeimg" src="assets/ui/Tome Spread.webp" alt="">
      <div id="tomeclose"></div>
      <div class="tab" id="tab-brew" title="Brew Book">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h8a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M16 9h2.5a1.5 1.5 0 0 1 0 5H16"/><path d="M6 8h10"/></svg>
      </div>
      <div class="tab" id="tab-ledger" title="Regulars' Ledger">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="6" width="15" height="12" rx="2"/><path d="M8 10h8M8 14h5"/></svg>
      </div>
      <div class="tab" id="tab-herald" title="Arena Herald">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5c-1.2 0-2 .9-2 2s.8 2 2 2V5z"/><path d="M5 5h12a2 2 0 0 1 2 2v10a2 2 0 0 0 2 2H7a2 2 0 0 1-2-2V5z"/><path d="M9 9h6M9 13h6M9 16h4"/></svg>
      </div>
      <div class="tab" id="tab-song" title="Bard's Songbook">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="18" r="3"/><path d="M11 18V5l8-2v11"/><circle cx="16" cy="16" r="3"/></svg>
      </div>
      <div id="pageL"></div>
      <div id="pageR"></div>
      <div id="spread" hidden>
        <div id="spreadvp"><div id="spreadflow"></div></div>
      </div>
      <!-- nav furniture overlay: spans the paper box, always present so grid
           AND spread share one placement + one cleanup (no lingering arrows).
           The fletched arrow is page-turn only; back-to-grid is a round button. -->
      <div id="tomenav"></div>
      <div id="pageflip">
        <div class="backdrop"></div>
        <div class="sweep"></div>
        <div class="leaf">
          <div class="paper">
            <div class="face front"><div class="curlfx"></div></div>
            <div class="face back"><div class="edgemask"></div><div class="curlfx"></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- SETTINGS OVERLAY (GDD §11) -->
    <div id="settings" class="overlay">
      <div class="panel">
        <h2 id="set-title"></h2>
        <div class="setrow"><label id="set-lang-label" for="lang-select"></label><select id="lang-select"></select></div>
        <p id="set-disclaimer"></p>
        <div class="setrow volrow">
          <label id="set-music-label" for="vol-music"></label>
          <button class="vol-mute" id="mute-music" type="button" aria-label="Mute music">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M18.6 6a8 8 0 0 1 0 12"/><path class="slash" d="M3 3l18 18"/></svg>
          </button>
          <div class="vol-track"><input type="range" min="0" max="100" step="1" value="50" id="vol-music" class="vol-slider" aria-label="Music volume"></div>
          <span class="vol-pct" id="pct-music">70%</span>
        </div>
        <div class="setrow volrow">
          <label id="set-sfx-label" for="vol-sfx"></label>
          <button class="vol-mute" id="mute-sfx" type="button" aria-label="Mute sound effects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M18.6 6a8 8 0 0 1 0 12"/><path class="slash" d="M3 3l18 18"/></svg>
          </button>
          <div class="vol-track"><input type="range" min="0" max="100" step="1" value="70" id="vol-sfx" class="vol-slider" aria-label="Sound effects volume"></div>
          <span class="vol-pct" id="pct-sfx">70%</span>
        </div>
        <div class="setrow"><span></span><button class="btn small sage" id="btn-about"></button></div>
        <button class="btn small primary" id="btn-set-back"></button>
      </div>
    </div>

    <!-- NIGHT CAP (GDD §11) — the shareable end-of-Night postcard, composed
         on a canvas from shipped art. Download PNG / Web Share where available. -->
    <div id="nightcap" class="overlay">
      <div class="nc-panel">
        <h2 id="nightcap-heading"></h2>
        <div class="nc-preview"><canvas id="nightcap-canvas" width="1200" height="1500"></canvas></div>
        <div class="nc-actions">
          <button class="btn small primary" id="nightcap-download"></button>
          <!-- §R16: Share is sage — matching the buttons that OPEN the Night Cap. Close stays cream. -->
          <button class="btn small sage" id="nightcap-share"></button>
          <button class="btn small" id="nightcap-close"></button>
        </div>
        <!-- §R15: desktop "link copied" toast — two lines (plain + Sage's green hand).
             §R16 also carries the download-failure message, so it is a live region, not
             aria-hidden: it is the ONLY feedback a failed download gives. -->
        <div id="nc-toast" role="status" aria-live="polite"></div>
      </div>
    </div>

    <!-- ABOUT / CREDITS OVERLAY (GDD §13/§17 disclaimers) -->
    <div id="about" class="overlay">
      <div class="panel">
        <h2 id="about-title"></h2>
        <p id="about-p1"></p>
        <p id="about-p2"></p>
        <p id="about-p4"></p>
        <p id="about-p3"></p>
        <button class="btn small primary" id="btn-about-back"></button>
      </div>
    </div>

    <!-- in-game toast: e.g. "This browser can't keep saves" when storage is
         blocked (file:// / private mode). Shown by Screens.toast(), never a
         console-only note (P0 06-07). -->
    <div id="toast"></div>

    <!-- R13: layout-change dip — a warm near-dark camera cut when the bar's layout
         changes (serve<->duo<->group), so two different layouts never cross-fade
         into a double-exposure. Same-layout swaps still cross-fade (untouched). -->
    <div id="dip" aria-hidden="true"></div>

    <!-- persistent play-screen HUD (§11, locked 07/07): menu top-right (opens a
         pause tray), Tome button bottom-right (pulses once when something new
         lands). Shown only on serve/group/duo; hidden on title/interstitials. -->
    <button id="hud-menu" class="hud-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button id="hud-tome" class="hud-btn tome" aria-label="The Tome"><img src="assets/ui/Tome Icon (cutout).webp?v=35" alt=""></button>
    <div id="autosave-quill" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-3 0-9 3-12 9l-4 7 7-4c6-3 9-9 9-12z"/><path d="M8.5 16.5l-2 2"/></svg><span id="autosave-word"></span></div>
    <div id="hint-chip"></div>

    <!-- MENU TRAY (§11 pause): Resume / The Tome / Settings / Save & Quit -->
    <div id="menu-tray" class="overlay">
      <div class="panel">
        <button class="vol-mute tray-mute" id="tray-mute-music" type="button" aria-label="Mute music">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M18.6 6a8 8 0 0 1 0 12"/><path class="slash" d="M3 3l18 18"/></svg>
        </button>
        <h2 id="menu-title"></h2>
        <button class="btn small primary" id="menu-resume"></button>
        <button class="btn small" id="menu-tome"></button>
        <button class="btn small" id="menu-settings"></button>
        <button class="btn small" id="menu-savequit"></button>
        <p id="menu-note"></p>
      </div>
    </div>

  </div>
</div>

<div id="dev" hidden></div>

<!-- ?v=<BUILD> on every script — BUMP the token on every build (see head note) -->
<script src="strings/strings.js?v=35"></script>
<script src="data/nights.js?v=35"></script>
<script src="data/cast.js?v=35"></script>
<!-- §R17: measured portrait framing for the scenes. Must load before src/screens.js. -->
<script src="data/framing.js?v=35"></script>
<script src="data/tome.js?v=35"></script>
<script src="data/today.js?v=35"></script>
<script src="src/stage.js?v=35"></script>
<script src="src/save.js?v=35"></script>
<script src="src/particles.js?v=35"></script>
<script src="src/screens.js?v=35"></script>
<script src="src/brew.js?v=35"></script>
<script src="src/dialogue.js?v=35"></script>
<script src="src/state.js?v=35"></script>
<script src="src/tome.js?v=35"></script>
<script src="src/nightcap.js?v=35"></script>
<script src="src/audio.js?v=35"></script>
<script src="src/settings.js?v=35"></script>
<script src="src/hud.js?v=35"></script>
<script src="src/boot.js?v=35"></script>
</body>
</html>
